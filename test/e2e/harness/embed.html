<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Elide harness embed</title>
<style>
  body { margin: 0; background: #000; }
  #movie_player { position: absolute; inset: 0; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <!-- Stand-in for youtube.com/embed: plays the content from ?start= with no ads. -->
  <div id="movie_player" class="html5-video-player">
    <video class="video-stream html5-main-video" playsinline></video>
  </div>
  <script>
    const v = document.querySelector('video');
    const start = Number(new URLSearchParams(location.search).get('start') || 0);
    v.src = '/elide-harness/media/content.webm';
    v.addEventListener('loadedmetadata', () => { v.currentTime = start; v.play().catch(() => {}); }, { once: true });
  </script>
</body>
</html>
